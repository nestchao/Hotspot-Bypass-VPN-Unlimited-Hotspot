name: CI

on:
  push:
    branches: [master, 'claude/**']
    paths-ignore:
      - 'website/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
  # release.yml reuses these jobs so releases ship exactly what CI built.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app (unit tests + APK build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Set up release signing (if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets configured; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Check R8 kept the tun2socks engine
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          unzip -o -q "$apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          for cls in Lengine/Engine\; Lengine/Key\; Lgo/Seq\; Lcom/example/hotspot_bypass_vpn/MyVpnServiceTun2Socks\; Lcom/example/hotspot_bypass_vpn/HostService\;; do
            grep -q -a "$cls" "$RUNNER_TEMP"/dex/classes*.dex || { echo "::error::$cls missing from release APK"; exit 1; }
          done
          echo "Release APK keeps the tun2socks bindings and service classes."
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  laptop-client:
    name: Windows laptop client (pytest + portable build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: laptop_proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Check the GUI module imports
        run: python -c "import main"
      - name: Build portable package
        shell: cmd
        run: build_exe.bat
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci' }
          iscc "/DMyAppVersion=$version" laptop_proxy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            laptop_proxy/dist/Hotspot_Bypass_VPN_Windows_Portable.zip
            laptop_proxy/Output/HotspotBypassVPNSetup.exe
          if-no-files-found: error
