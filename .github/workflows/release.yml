name: Release

# Push a tag like v7.0.0 to build everything with the CI workflow and attach
# the APK, the Windows installer and the portable zip to a *draft* GitHub
# release. Review the draft and publish it by hand.
#
# File names match the README/website links under releases/latest/download/.
#
# For a signed (installable) release APK, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is attached as Hotspot-Bypass-VPN-unsigned.apk, and
# you need to sign it and upload it as Hotspot-Bypass-VPN.apk yourself.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(ls artifacts/android-apks/release/*.apk | head -n1)
          case "$apk" in
            *unsigned*)
              echo "::warning::Release APK is unsigned (no signing secrets). Sign it before publishing."
              cp "$apk" release/Hotspot-Bypass-VPN-unsigned.apk ;;
            *) cp "$apk" release/Hotspot-Bypass-VPN.apk ;;
          esac
          cp artifacts/windows-packages/Output/HotspotBypassVPNSetup.exe release/
          cp artifacts/windows-packages/dist/Hotspot_Bypass_VPN_Windows_Portable.zip release/Hotspot_Bypass_VPN_Windows.zip
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
