<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03DAC5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>
  <g transform="translate(200,200)">
    <!-- Phone icon -->
    <rect x="-40" y="-70" width="80" height="140" rx="12" stroke="#03DAC5" stroke-width="4" fill="none"/>
    <circle cx="0" cy="58" r="4" fill="#03DAC5"/>
    <!-- Signal waves -->
    <path d="M-20 -30 Q0 -50 20 -30" stroke="#03DAC5" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M-30 -45 Q0 -70 30 -45" stroke="#03DAC5" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M-40 -60 Q0 -90 40 -60" stroke="#03DAC5" stroke-width="3" fill="none" opacity="0.2"/>
    <!-- Arrow going right -->
    <line x1="30" y1="0" x2="65" y2="0" stroke="#7C4DFF" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="65,-6 75,0 65,6" fill="#7C4DFF"/>
    <!-- Second phone -->
    <rect x="75" y="-45" width="50" height="90" rx="8" stroke="#7C4DFF" stroke-width="3" fill="none" opacity="0.8"/>
    <circle cx="100" cy="37" r="3" fill="#7C4DFF" opacity="0.8"/>
    <!-- Laptop -->
    <rect x="130" y="-20" width="60" height="40" rx="4" stroke="#03DAC5" stroke-width="3" fill="none"/>
    <line x1="135" y1="20" x2="185" y2="20" stroke="#03DAC5" stroke-width="3"/>
    <rect x="145" y="20" width="30" height="6" rx="2" fill="#03DAC5"/>
    <!-- Console -->
    <rect x="195" y="-15" width="50" height="30" rx="6" stroke="#7C4DFF" stroke-width="3" fill="none" opacity="0.8"/>
    <circle cx="210" cy="0" r="3" fill="#7C4DFF" opacity="0.8"/>
    <circle cx="230" cy="0" r="3" fill="#7C4DFF" opacity="0.8"/>
  </g>
</svg>
