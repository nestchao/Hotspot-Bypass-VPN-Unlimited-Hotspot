  <text x="30" y="137" fill="#888" font-size="10">Proxy IP</text>
  <rect x="30" y="142" width="200" height="24" rx="4" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <text x="38" y="158" fill="#ccc" font-size="11">192.168.49.1</text>

  <text x="30" y="175" fill="#888" font-size="10">Port</text>
  <rect x="30" y="180" width="200" height="24" rx="4" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <text x="38" y="196" fill="#ccc" font-size="11">8080</text>

  <!-- Mode Selection -->
  <rect x="270" y="96" width="230" height="130" rx="8" fill="#252535"/>
