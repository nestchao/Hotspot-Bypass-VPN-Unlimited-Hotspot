  <text x="35" y="274" fill="#fff" font-size="13" font-weight="bold">1.2 MB</text>
  <text x="135" y="260" fill="#888" font-size="10">RX</text>
  <text x="135" y="274" fill="#fff" font-size="13" font-weight="bold">4.8 MB</text>
  <text x="235" y="260" fill="#888" font-size="10">Uptime</text>
  <text x="235" y="274" fill="#fff" font-size="13" font-weight="bold">00:12:34</text>
