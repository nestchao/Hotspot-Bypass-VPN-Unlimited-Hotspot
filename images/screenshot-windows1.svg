  <text x="30" y="310" fill="#03DAC5" font-size="11" font-weight="bold">📋 Live Log</text>
  <rect x="20" y="316" width="480" height="84" rx="0" fill="#0d001a"/>
  <text x="30" y="334" fill="#aaa" font-size="9" font-family="Consolas, monospace">[12:34:01] ✅ SOCKS5 proxy connected</text>
  <text x="30" y="348" fill="#aaa" font-size="9" font-family="Consolas, monospace">[12:34:01] 🔄 TUN adapter created</text>
  <text x="30" y="362" fill="#aaa" font-size="9" font-family="Consolas, monospace">[12:34:02] 🌐 Routing all traffic through proxy</text>
